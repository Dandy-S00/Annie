name: Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build and test
        run: |
          go mod download
          go build -o annie main.go
          # Add tests if available
          # go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/annie:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/annie:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/annie:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/annie:buildcache,mode=max

      - name: Deploy to Azure App Service
        run: |
          az webapp deployment container config \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --docker-custom-image-name "${{ secrets.ACR_LOGIN_SERVER }}/annie:latest" \
            --docker-registry-server-url "https://${{ secrets.ACR_LOGIN_SERVER }}" \
            --docker-registry-server-username ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"
          
          az webapp deployment container show \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }}

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }}

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -s "https://${{ secrets.WEBAPP_NAME }}.azurewebsites.net/health" > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 10
          done
          echo "Application failed to start"
          exit 1

      - name: Post deployment notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.job.status;
            const color = status === 'success' ? '16711680' : '16711680'; // Green or Red
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Deployment to Azure ${{ github.event.inputs.environment || 'dev' }} ${status === 'success' ? '✅ succeeded' : '❌ failed'}`
            });
