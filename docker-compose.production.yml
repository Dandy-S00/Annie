services:
  annie:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ANNIE_IMAGE:-annie:local}
    restart: unless-stopped
    init: true
    ports:
      - "${ANNIE_BIND_ADDRESS:-127.0.0.1}:${ANNIE_PORT:-8080}:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_CACHING: ${ENABLE_CACHING:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT:?AZURE_SEARCH_ENDPOINT is required}
      AZURE_SEARCH_KEY: ${AZURE_SEARCH_KEY:?AZURE_SEARCH_KEY is required}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?AZURE_OPENAI_ENDPOINT is required}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:?AZURE_OPENAI_KEY is required}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-05-01-preview}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:?AZURE_OPENAI_DEPLOYMENT_NAME is required}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
